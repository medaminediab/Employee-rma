<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Pointage Caméra</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#172033;
}
header{
  background:#2563eb;
  color:#fff;
  padding:18px 15px;
  text-align:center;
}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
main{width:min(900px,100%);margin:auto;padding:14px}
.card{
  background:#fff;
  border-radius:15px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}
h2{font-size:18px;margin:0 0 8px}
button{
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
#camera{
  width:100%;
  max-width:620px;
  display:block;
  margin:14px auto 8px;
  border-radius:14px;
  background:#000;
  aspect-ratio:4/3;
  object-fit:cover;
}
#cameraPlaceholder{
  width:100%;
  max-width:620px;
  aspect-ratio:4/3;
  margin:14px auto 8px;
  border-radius:14px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  font-size:14px;
}
.status{
  text-align:center;
  font-size:14px;
  font-weight:bold;
  margin:10px 0;
}
.ok{color:#15803d}
.err{color:#dc2626}
.actions{display:flex;gap:10px;margin-top:10px}
.actions button{flex:1}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e2e8f0;color:#334155}
.excel{background:#15803d;color:#fff}
.danger{background:#dc2626;color:#fff}
.date{text-align:center;font-weight:bold;margin:8px 0 14px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{
  padding:11px 9px;
  border-bottom:1px solid #e2e8f0;
  font-size:13px;
  text-align:left;
}
th{background:#f8fafc}
.empty{text-align:center;color:#64748b;padding:22px}
.badge{
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}
.open{background:#fef3c7;color:#92400e}
.closed{background:#dcfce7;color:#166534}
.record-actions{display:flex;gap:6px;white-space:nowrap}.icon-btn{border:0;background:transparent;padding:5px;font-size:17px;cursor:pointer;border-radius:7px;line-height:1}.icon-btn:hover{background:#f1f5f9}.edit-icon{color:#2563eb}.delete-icon{color:#dc2626}
.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:20px;
  max-width:90%;
  transform:translate(-50%,130px);
  transition:.25s;
  background:#172033;
  color:#fff;
  border-radius:10px;
  padding:13px 18px;
  text-align:center;
}
.toast.show{transform:translate(-50%,0)}
#confirmModal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
#confirmModal.show{display:flex}
.confirm-box{width:min(360px,100%);background:#fff;border-radius:15px;padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.2);text-align:center}
.confirm-box h3{margin:0 0 18px;font-size:18px}
.confirm-actions{display:flex;gap:10px}
.confirm-actions button{flex:1}
.confirm-yes{background:#dc2626;color:#fff}
.confirm-no{background:#e2e8f0;color:#334155}
@media(max-width:600px){
  .actions{flex-direction:column}
  }
</style>
</head>

<body>

<header>
  <h1>📷 Pointage Employés</h1>
  
</header>

<main>

<section class="card">
  <h2>Pointage</h2>
<video id="camera" autoplay muted playsinline style="display:none"></video>
  <div id="cameraPlaceholder">La caméra est arrêtée.<br>Appuyez sur « Démarrer la caméra ».</div>

  <div id="status" class="status">Prêt</div>

  <div class="actions">
    <button id="startBtn" class="primary" type="button">📷 Scanner</button>
  </div>
</section>

<section class="card">
  <h2>📋 Pointages du jour</h2>
  <div id="today" class="date"></div>

  <div class="actions">
    <button id="excelBtn" class="excel" type="button">📥 Exporter vers Excel</button>
    <button id="clearBtn" class="danger" type="button">🗑 Effacer les pointages</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Matricule</th>
          <th>Entrée</th>
          <th>Sortie</th>
          <th>Durée travaillée</th>
          <th>Heures supplémentaires</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </div>
</section>

</main>

<div id="confirmModal">
  <div class="confirm-box">
    <h3 id="confirmMessage">Confirmer ?</h3>
    <div class="confirm-actions">
      <button id="confirmNo" class="confirm-no" type="button">Non</button>
      <button id="confirmYes" class="confirm-yes" type="button">Oui</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/*
  VERSION SANS BIBLIOTHÈQUE EXTERNE.

  Le scan utilise BarcodeDetector lorsque le navigateur le supporte.
  Chrome/Edge Android récents peuvent fournir cette API.
  Si elle n'est pas disponible, l'application indique clairement
  que le moteur natif de lecture de codes-barres n'est pas disponible.
*/

const STORAGE_KEY="pointage_camera_offline_v1";

let records=[];
try{
  records=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  if(!Array.isArray(records)) records=[];
}catch(e){
  records=[];
}

let stream=null;
let detector=null;
let scanning=false;
let lastCode="";
let lastScanTime=0;
let audioContext=null;
let scanConfirmOpen=false;
let pendingScanCode="";

const video=document.getElementById("camera");
const placeholder=document.getElementById("cameraPlaceholder");
const statusEl=document.getElementById("status");

/* ---------------- DATE / HEURE ---------------- */

function pad(n){
  return String(n).padStart(2,"0");
}

function dateKey(){
  const d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function timeKey(){
  const d=new Date();
  return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}

function displayDate(k){
  const p=k.split("-");
  return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : k;
}

/* ---------------- STOCKAGE ---------------- */

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
}

/* ---------------- UI ---------------- */

function setStatus(text,good=false,error=false){
  statusEl.textContent=text;
  statusEl.className="status "+(good?"ok":"")+(error?" err":"");
}

function showToast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.remove("show"),3000);
}


/* ---------------- CAMÉRA ---------------- */

async function startCamera(){

  if(scanning){
    showToast("La caméra est déjà active.");
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus("Ce navigateur ne permet pas l'accès à la caméra ici.",false,true);
    showToast("Caméra non disponible.");
    return;
  }

  if(!("BarcodeDetector" in window)){
    setStatus(
      "Ce navigateur ne fournit pas BarcodeDetector. Le scan natif n'est pas disponible dans cette configuration.",
      false,true
    );
    showToast("Lecteur code-barres non disponible.");
    return;
  }

  try{

    const formats=[
      "qr_code",
      "code_128",
      "code_39",
      "code_93",
      "codabar",
      "ean_13",
      "ean_8",
      "itf",
      "upc_a",
      "upc_e"
    ];

    try{
      const supported=await BarcodeDetector.getSupportedFormats();
      const wanted=formats.filter(x=>supported.includes(x));
      detector=new BarcodeDetector({
        formats:wanted.length?wanted:supported
      });
    }catch(e){
      detector=new BarcodeDetector();
    }

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    video.style.display="block";
    placeholder.style.display="none";

    await video.play();

    scanning=true;
    setStatus("Caméra active — présentez le badge devant la caméra.",true);

    scanLoop();

  }catch(error){

    console.error(error);

    stopCamera();

    if(error.name==="NotAllowedError"){
      setStatus(
        "Accès caméra refusé. Autorisez la caméra dans Chrome/Edge.",
        false,true
      );
      showToast("Permission caméra refusée.");
    }else if(error.name==="NotFoundError"){
      setStatus("Aucune caméra disponible.",false,true);
      showToast("Caméra introuvable.");
    }else{
      setStatus(
        "Impossible d'ouvrir la caméra. Vérifiez HTTPS et la permission caméra.",
        false,true
      );
      showToast("Erreur d'ouverture de la caméra.");
    }
  }
}

function stopCamera(){

  scanning=false;

  if(stream){
    stream.getTracks().forEach(track=>track.stop());
  }

  stream=null;
  video.srcObject=null;
  video.style.display="none";
  placeholder.style.display="flex";

  setStatus("Caméra arrêtée.");
}

async function scanLoop(){

  if(!scanning || !detector)return;

  try{

    if(video.readyState>=2){

      const codes=await detector.detect(video);

      if(codes && codes.length){

        for(const item of codes){

          const value=(item.rawValue||"").trim();

          if(value){
            handleScan(value);
            break;
          }
        }
      }
    }

  }catch(error){
    console.warn("Scan:",error);
  }

  if(scanning){
    requestAnimationFrame(scanLoop);
  }
}

/* ---------------- FEEDBACK SCAN ---------------- */

function scanFeedback(){
  // Bip sonore
  try{
    if(!audioContext){
      audioContext=new (window.AudioContext||window.webkitAudioContext)();
    }
    if(audioContext.state==="suspended"){
      audioContext.resume();
    }

    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();

    oscillator.type="sine";
    oscillator.frequency.value=880;
    gain.gain.setValueAtTime(0.001,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18,audioContext.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001,audioContext.currentTime+0.12);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime+0.13);
  }catch(e){
    console.warn("Bip:",e);
  }

  // Vibration courte sur les appareils compatibles
  try{
    if("vibrate" in navigator){
      navigator.vibrate(180);
    }
  }catch(e){
    console.warn("Vibration:",e);
  }
}

/* ---------------- SCAN ---------------- */

function handleScan(code){
  if(scanConfirmOpen) return;
  const now=Date.now();
  if(code===lastCode && now-lastScanTime<3000) return;
  lastCode=code; lastScanTime=now; pendingScanCode=code; scanConfirmOpen=true;
  scanFeedback(); stopCamera();
  const date=dateKey();
  const open=[...records].reverse().find(r=>r.date===date && String(r.matricule).toLowerCase()===String(code).toLowerCase() && r.entree && !r.sortie);
  const operation=open ? "SORTIE" : "ENTRÉE";
  openConfirm("Confirmer le pointage ?\nMatricule : "+code+"\nOpération : "+operation,()=>{
    registerPointage(pendingScanCode); pendingScanCode=""; scanConfirmOpen=false; setTimeout(startCamera,150);
  },()=>{
    pendingScanCode=""; scanConfirmOpen=false; setStatus("Scan annulé. Reprise du scanner."); setTimeout(startCamera,150);
  });
}

/* ---------------- CALCUL DU TEMPS ---------------- */

function minutesFromTime(t){
  if(!t) return null;
  const p=t.split(":").map(Number);
  return p[0]*60+p[1]+(p[2]||0)/60;
}

function workedMinutes(entree, sortie){
  if(!entree || !sortie) return 0;
  let start=minutesFromTime(entree);
  let end=minutesFromTime(sortie);
  if(end < start) end += 24*60;

  // Pause fixe 12:00-13:00 : on retire uniquement la partie réellement
  // comprise dans l'intervalle travaillé.
  const pauseStart=12*60;
  const pauseEnd=13*60;
  const overlap=Math.max(0, Math.min(end,pauseEnd)-Math.max(start,pauseStart));
  return Math.max(0,end-start-overlap);
}

function formatDuration(mins){
  if(mins===null || mins===undefined || isNaN(mins)) return "";
  mins=Math.max(0,Math.round(mins));
  return Math.floor(mins/60)+"h "+String(mins%60).padStart(2,"0")+"min";
}

function overtimeMinutes(entree, sortie){
  if(!entree || !sortie) return 0;
  const end=minutesFromTime(sortie);
  // Les heures supplémentaires commencent après 17:00.
  return Math.max(0,end-17*60);
}

/* ---------------- POINTAGE AUTOMATIQUE ---------------- */

function registerPointage(matricule){

  const date=dateKey();
  const heure=timeKey();

  // Le système détermine automatiquement l'opération :
  // aucune entrée ouverte = ENTRÉE
  // entrée ouverte = SORTIE
  const open=[...records].reverse().find(r=>
    r.date===date &&
    r.matricule.toLowerCase()===matricule.toLowerCase() &&
    r.entree &&
    !r.sortie
  );

  if(!open){

    records.push({
      id:Date.now(),
      date:date,
      matricule:matricule,
      entree:heure,
      sortie:""
    });

    save();
    render();

    showToast("Entrée enregistrée");
    setStatus("Entrée • "+matricule+" • "+heure,true);

  }else{

    open.sortie=heure;

    save();
    render();

    showToast("Sortie enregistrée");
    setStatus("Sortie • "+matricule+" • "+heure,true);
  }
}

/* ---------------- TABLEAU ---------------- */


function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function render(){

  document.getElementById("today").textContent=
    "Date : "+displayDate(dateKey());

  const body=document.getElementById("recordsBody");

  const rows=records
    .filter(r=>r.date===dateKey())
    .sort((a,b)=>b.id-a.id);

  if(!rows.length){
    body.innerHTML=
      '<tr><td colspan="8" class="empty">Aucun pointage aujourd’hui.</td></tr>';
    return;
  }

  body.innerHTML=rows.map(r=>{

    const worked=r.sortie ? workedMinutes(r.entree,r.sortie) : null;
    const overtime=r.sortie ? overtimeMinutes(r.entree,r.sortie) : null;
    const badge=r.sortie
      ? '<span class="badge closed">Terminé</span>'
      : '<span class="badge open">En cours</span>';

    return `
      <tr>
        <td>${escapeHtml(displayDate(r.date))}</td>
        <td><b>${escapeHtml(r.matricule)}</b></td>
        <td>${escapeHtml(r.entree)}</td>
        <td>${escapeHtml(r.sortie||"")}</td>
        <td>${escapeHtml(formatDuration(worked))}</td>
        <td>${escapeHtml(formatDuration(overtime))}</td>
        <td>${badge}</td>
        <td><div class="record-actions">
          <button class="icon-btn edit-icon" type="button" title="Modifier" aria-label="Modifier" onclick="editRecord(${r.id})">✏️</button>
          <button class="icon-btn delete-icon" type="button" title="Supprimer" aria-label="Supprimer" onclick="deleteRecord(${r.id})">🗑️</button>
        </div></td>
      </tr>
    `;

  }).join("");
}

/* ---------------- MODIFIER / SUPPRIMER UN POINTAGE ---------------- */
let pendingConfirmAction=null;

let pendingConfirmCancel=null;
function openConfirm(message, action, cancelAction=null){
  document.getElementById("confirmMessage").textContent=message;
  pendingConfirmAction=action; pendingConfirmCancel=cancelAction;
  document.getElementById("confirmModal").classList.add("show");
}

function editRecord(id){
  const r=records.find(x=>x.id===id); if(!r)return;
  const entree=prompt("Heure d'entrée (HH:MM:SS)",r.entree||""); if(entree===null)return;
  const sortie=prompt("Heure de sortie (HH:MM:SS)",r.sortie||""); if(sortie===null)return;
  const re=/^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$/;
  if(entree&&!re.test(entree)){showToast("Heure d'entrée invalide.");return;}
  if(sortie&&!re.test(sortie)){showToast("Heure de sortie invalide.");return;}

  openConfirm("Confirmer la modification du pointage ?",()=>{
    r.entree=entree;
    r.sortie=sortie;
    save();
    render();
    showToast("Pointage modifié.");
  });
}

function deleteRecord(id){
  if(!records.some(r=>r.id===id))return;
  openConfirm("Confirmer la suppression du pointage ?",()=>{
    records=records.filter(r=>r.id!==id);
    save();
    render();
    showToast("Pointage supprimé.");
  });
}

/* ---------------- EXCEL COMPATIBLE ---------------- */

function excelXmlEscape(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");
}

function makeExcelXml(rows){

  const headers=[
    "Date",
    "Matricule",
    "Heure d'entrée",
    "Heure de sortie",
    "Durée travaillée",
    "Heures supplémentaires",
    "Statut"
  ];

  const headerCells=headers.map(h=>
    `<Cell ss:StyleID="Header"><Data ss:Type="String">${excelXmlEscape(h)}</Data></Cell>`
  ).join("");

  const dataRows=rows.map(r=>{

    const status=r.sortie?"Terminé":"En cours";

    const values=[
      displayDate(r.date),
      r.matricule,
      r.entree||"",
      r.sortie||"",
      formatDuration(r.sortie ? workedMinutes(r.entree,r.sortie) : null),
      formatDuration(r.sortie ? overtimeMinutes(r.entree,r.sortie) : null),
      status
    ];

    return "<Row>"+
      values.map(v=>
        `<Cell><Data ss:Type="String">${excelXmlEscape(v)}</Data></Cell>`
      ).join("")+
      "</Row>";

  }).join("");

  return `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
<Style ss:ID="Header">
<Font ss:Bold="1"/>
<Interior ss:Color="#D9EAF7" ss:Pattern="Solid"/>
</Style>
</Styles>
<Worksheet ss:Name="Pointage">
<Table>
<Column ss:Width="90"/>
<Column ss:Width="150"/>
<Column ss:Width="110"/>
<Column ss:Width="110"/>
<Column ss:Width="90"/>
<Row ss:AutoFitHeight="0">${headerCells}</Row>
${dataRows}
</Table>
</Worksheet>
</Workbook>`;
}

/* ---------------- GOOGLE SHEETS ---------------- */

const GOOGLE_SHEETS_CONFIG = {
  // Après déploiement du Google Apps Script, collez ici l'URL
  // se terminant par /exec.
  WEB_APP_URL: "COLLER_ICI_URL_APPS_SCRIPT"
};

async function exportToGoogleSheets(){

  if(!records.length){
    showToast("Aucun pointage à exporter.");
    return;
  }

  if(!GOOGLE_SHEETS_CONFIG.WEB_APP_URL ||
     GOOGLE_SHEETS_CONFIG.WEB_APP_URL==="COLLER_ICI_URL_APPS_SCRIPT"){
    showToast("Connexion Google Sheets non configurée.");
    return;
  }

  const rows=records
    .slice()
    .sort((a,b)=>(b.date+b.entree).localeCompare(a.date+a.entree));

  const payload={
    action:"appendAttendance",
    spreadsheetId:"18n-tO34vWnZdFt6Msm61FTtbpBMa4M3qUUTVgDfQU00",
    sheetName:"Pointage",
    records:rows
  };

  try{
    await fetch(GOOGLE_SHEETS_CONFIG.WEB_APP_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload)
    });

    showToast("✅ Pointages envoyés à Google Sheets.");
  }catch(error){
    console.error(error);
    showToast("❌ Envoi Google Sheets impossible.");
  }
}

function exportExcel(){
  exportToGoogleSheets();
}


/* ---------------- EFFACER ---------------- */

function clearRecords(){

  if(!records.length){
    showToast("Aucun pointage à effacer.");
    return;
  }

  openConfirm("Supprimer tous les pointages ?",()=>{
    records=[];
    save();
    render();
    showToast("Tous les pointages ont été supprimés.");
  });
}

function closeConfirm(){
  document.getElementById("confirmModal").classList.remove("show");
  const wasScan=scanConfirmOpen; pendingConfirmAction=null; pendingConfirmCancel=null;
  if(wasScan){ pendingScanCode=""; scanConfirmOpen=false; setTimeout(startCamera,150); }
}

function confirmClearRecords(){
  if(typeof pendingConfirmAction==="function"){
    const action=pendingConfirmAction;
    pendingConfirmAction=null;
    document.getElementById("confirmModal").classList.remove("show");
    action();
  }else{
    closeConfirm();
  }
}

/* ---------------- BOUTONS ---------------- */

document.getElementById("startBtn").addEventListener(
  "click",startCamera
);

document.getElementById("excelBtn").addEventListener(
  "click",exportExcel
);

document.getElementById("clearBtn").addEventListener(
  "click",clearRecords
);

document.getElementById("confirmNo").addEventListener("click",()=>{
  if(scanConfirmOpen && typeof pendingConfirmCancel==="function"){ const cancel=pendingConfirmCancel; pendingConfirmCancel=null; pendingConfirmAction=null; document.getElementById("confirmModal").classList.remove("show"); cancel(); return; }
  closeConfirm();
});
document.getElementById("confirmYes").addEventListener("click",confirmClearRecords);
document.getElementById("confirmModal").addEventListener("click",e=>{
  if(e.target.id==="confirmModal"){ if(scanConfirmOpen) return; closeConfirm(); }
});

window.addEventListener("beforeunload",stopCamera);

render();

/*
  Vérification immédiate du support du navigateur.
*/
if(!("BarcodeDetector" in window)){
  setStatus(
    "Navigateur compatible caméra, mais BarcodeDetector n'est pas disponible pour le scan natif.",
    false,true
  );
}
</script>

</body>
</html>
